name = "telegram-russian-teacher"
main = "dist/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"

[triggers]
crons = []

[[d1_databases]]
binding = "DB"
database_name = "russian-teacher"
database_id = "baefa0a8-252a-4d19-9a5d-f62fdfbb5913"
migrations_dir = "migrations"

[observability]
enabled = true
head_sampling_rate = 1.0
